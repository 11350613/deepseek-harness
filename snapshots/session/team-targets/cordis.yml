# Team members must mask ordinary tools even when an enclosing composition enables them.
- id: tool-subagent-control
  disabled: false
- id: tool-subagent-report
  disabled: true
- id: tool-subagent
  disabled: false
  config:
    provider: spawn
    toolName: subagent
    modelDiscovery: true
- id: tool-subagent-fork
  disabled: false
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
